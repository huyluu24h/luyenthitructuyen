services:
  - type: web
    name: quan-ly-thi-truc-tuyen
    runtime: docker
    plan: starter
    healthCheckPath: /health
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: APP_ENV
        value: production
      - key: TRUST_PROXY_HEADERS
        value: "1"
      - key: ADMIN_INITIAL_PASSWORD
        sync: false
      - key: ENABLE_DEMO_ACCOUNTS
        value: "0"
      - key: APP_DATA_DIR
        value: /app/storage
      - key: WEB_CONCURRENCY
        value: "1"
      - key: GUNICORN_THREADS
        value: "4"
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-5.6-luna
    disk:
      name: exam-data
      mountPath: /app/storage
      sizeGB: 1
