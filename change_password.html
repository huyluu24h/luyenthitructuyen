{% extends 'base.html' %}{% block title %}Đổi mật khẩu{% endblock %}
{% block content %}<div class="card"><h2>Đổi mật khẩu</h2>
<form method="post"><label>Mật khẩu hiện tại <input name="current_password" type="password" required></label><br>
<label>Mật khẩu mới <input name="new_password" type="password" minlength="10" required></label><br>
<label>Nhập lại mật khẩu mới <input name="repeat_password" type="password" minlength="10" required></label><br>
<button class="btn">Lưu mật khẩu mới</button></form></div>{% endblock %}
